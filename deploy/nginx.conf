# Incognito web — static bundle plus the two proxies the app expects.
#
# These mirror web/vite.config.ts exactly. If they drift, the app works in dev and breaks in
# production in ways that look like data problems rather than routing ones.
#
#   /inc/*  → the keeper (netting status, funding).  Rewritten to /api/* , same as dev.
#   /api/*  → the Hence backend, for prices, charts and news. The fork inherits Hence's market
#             layer wholesale, so without this the terminal has no prices at all.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keeper. Same rewrite as the dev proxy: /inc/fund → /api/fund.
    location /inc/ {
        proxy_pass http://incognito-keeper:4400/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Hence backend, reachable by service name because both stacks share the compose network.
    location /api/ {
        proxy_pass http://app:4317/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        # /api/stream is Server-Sent Events. Buffering holds the whole response until it ends —
        # which for a stream is never — so prices would simply never arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
    }

    # SPA: the app is hash-routed, but a hard refresh on any path must still serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy takes hours to
    # reach a browser that already has one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
